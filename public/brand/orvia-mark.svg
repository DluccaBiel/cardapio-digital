<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Orvia">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D8EFF"/>
      <stop offset="1" stop-color="#1F4FD6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Anel orbital aberto (símbolo da letra O) -->
  <circle cx="256" cy="256" r="108" fill="none" stroke="#FFFFFF" stroke-width="54"
          stroke-dasharray="568.6 110" stroke-dashoffset="0" stroke-linecap="butt"/>
  <!-- Ponto de destino completando a órbita -->
  <circle cx="350" cy="201" r="38" fill="#FFFFFF"/>
</svg>
